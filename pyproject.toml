[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dnb-p-set"
version = "0.2.0"
description = "A Python package for analyzing, describing and using the P and Q set simulations published by DNB (De Nederlandsche Bank) for the Wet Toekomst Pensioenen."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["dnb", "pension", "scenario", "simulation", "p-set", "q-set", "WTP"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/danalytics1/dnb_p_set"
"Source Code" = "https://github.com/danalytics1/dnb_p_set"
"Bug Tracker" = "https://github.com/danalytics1/dnb_p_set/issues"
"DNB Scenariosets" = "https://www.dnb.nl/voor-de-sector/open-boek-toezicht/sectoren/pensioenfondsen/dnb-publiceert-definitieve-scenariosets-bij-wet-toekomst-pensioenen/"

[tool.setuptools.packages.find]
where = ["."]
include = ["dnb_p_set*", "market_implied*"]

[tool.pytest.ini_options]
testpaths = ["tests", "market_implied/tests"]

[project.scripts]
dnb-p-set-report = "dnb_p_set.report_cli:main"
market-implied = "market_implied.cli:main"
